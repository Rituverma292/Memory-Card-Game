<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate Memory Game</title>

<style>
:root{
  --bg: linear-gradient(135deg,#6a11cb,#2575fc);
  --card: rgba(255,255,255,0.15);
  --text: #fff;
}

body.dark{
  --bg: linear-gradient(135deg,#0f2027,#203a43,#2c5364);
  --card: rgba(0,0,0,0.4);
  --text: #fff;
}

body{
  margin:0;
  font-family:sans-serif;
  background:var(--bg);
  color:var(--text);
  display:flex;
  flex-direction:column;
  align-items:center;
  min-height:100vh;
  overflow:hidden;
}

/* floating bg */
.bg span{
  position:absolute;
  width:20px;
  height:20px;
  background:rgba(255,255,255,0.2);
  border-radius:50%;
  animation:float 10s linear infinite;
}
@keyframes float{
  from{transform:translateY(100vh);}
  to{transform:translateY(-10vh);}
}

/* header */
.header{text-align:center;margin:10px;}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;}

button,select{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  background:var(--card);
  color:var(--text);
  cursor:pointer;
  backdrop-filter:blur(10px);
}

/* grid */
.game{
  display:grid;
  gap:12px;
  padding:20px;
}

/* card */
.card{width:80px;height:100px;perspective:1000px;}
.card-inner{
  width:100%;height:100%;
  transform-style:preserve-3d;
  transition:.6s;
}
.card.flip .card-inner{transform:rotateY(180deg);}

.front,.back{
  position:absolute;
  width:100%;height:100%;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:15px;
  backface-visibility:hidden;
}
.front{background:var(--card);}
.back{background:#fff;color:#000;transform:rotateY(180deg);}

.match{box-shadow:0 0 15px #00ffcc;}

.info{display:flex;gap:15px;justify-content:center;margin-top:5px;}

.progress-bar{
  width:200px;height:10px;background:#ffffff30;border-radius:10px;margin:5px auto;
}
.progress{height:100%;width:0;background:#00ffcc;border-radius:10px;}

.leaderboard{
  margin-top:10px;
  font-size:12px;
  max-height:100px;
  overflow:auto;
}

/* responsive */
@media(max-width:600px){
  .card{width:60px;height:80px;}
}
</style>
</head>

<body>

<div class="bg" id="bg"></div>

<div class="header">
<h1>🧠 Memory Game</h1>

<div class="controls">
<select id="difficulty">
<option value="4">Easy</option>
<option value="6">Medium</option>
<option value="8">Hard</option>
</select>

<button onclick="startGame()">Restart</button>
<button onclick="toggleMode()">🌙 Mode</button>
</div>

<div class="info">
<span>Moves: <b id="moves">0</b></span>
<span>Time: <b id="time">0</b>s</span>
<span>Score: <b id="score">0</b></span>
</div>

<div class="progress-bar"><div class="progress" id="progress"></div></div>

<div class="leaderboard" id="leaderboard"></div>

</div>

<div class="game" id="game"></div>

<script>
const emojis=["🍎","🍌","🍇","🍉","🍓","🍒","🥝","🍍","🥥","🥑","🍑","🍋"];

let first,second,lock=false;
let moves=0,time=0,matched=0,interval;
const game=document.getElementById("game");

/* sounds */
const flipSound=new Audio("https://www.soundjay.com/button/beep-07.wav");
const matchSound=new Audio("https://www.soundjay.com/button/beep-10.wav");
const winSound=new Audio("https://www.soundjay.com/human/applause-8.wav");

function startGame(){
  game.innerHTML="";
  clearInterval(interval);
  moves=time=matched=0;

  updateUI();

  let size=document.getElementById("difficulty").value;
  game.style.gridTemplateColumns=`repeat(${size},1fr)`;

  let pairs=(size*size)/2;
  let arr=[...emojis.slice(0,pairs),...emojis.slice(0,pairs)]
  .sort(()=>Math.random()-0.5);

  arr.forEach(icon=>{
    let c=document.createElement("div");
    c.className="card";
    c.innerHTML=`
    <div class="card-inner">
      <div class="front">?</div>
      <div class="back">${icon}</div>
    </div>`;
    c.onclick=()=>flip(c,icon);
    game.appendChild(c);
  });
}

function flip(card,icon){
  if(lock||card.classList.contains("flip"))return;

  flipSound.play();

  if(time===0){
    interval=setInterval(()=>{time++;updateUI();},1000);
  }

  card.classList.add("flip");

  if(!first){first={card,icon};}
  else{
    second={card,icon};
    lock=true;
    moves++;

    if(first.icon===second.icon){
      matchSound.play();
      first.card.classList.add("match");
      second.card.classList.add("match");
      matched+=2;
      updateProgress();
      reset();

      if(matched===game.children.length) win();

    }else{
      setTimeout(()=>{
        first.card.classList.remove("flip");
        second.card.classList.remove("flip");
        reset();
      },700);
    }
  }
  updateUI();
}

function reset(){first=second=null;lock=false;}

function updateUI(){
  document.getElementById("moves").textContent=moves;
  document.getElementById("time").textContent=time;
  document.getElementById("score").textContent=getScore();
}

function getScore(){
  return Math.max(1000 - (moves*10 + time*5),0);
}

function updateProgress(){
  let p=(matched/game.children.length)*100;
  document.getElementById("progress").style.width=p+"%";
}

function win(){
  clearInterval(interval);
  winSound.play();

  let score=getScore();
  saveScore(score);

  setTimeout(()=>{
    alert(`🔥 You Win!\nScore: ${score}`);
  },300);
}

/* leaderboard */
function saveScore(score){
  let scores=JSON.parse(localStorage.getItem("scores")||"[]");
  scores.push(score);
  scores.sort((a,b)=>b-a);
  scores=scores.slice(0,5);
  localStorage.setItem("scores",JSON.stringify(scores));
  showScores();
}

function showScores(){
  let scores=JSON.parse(localStorage.getItem("scores")||"[]");
  document.getElementById("leaderboard").innerHTML=
    "🏆 Top Scores:<br>"+scores.join("<br>");
}

/* mode */
function toggleMode(){
  document.body.classList.toggle("dark");
}

/* floating bg */
function createBG(){
  let bg=document.getElementById("bg");
  for(let i=0;i<30;i++){
    let s=document.createElement("span");
    s.style.left=Math.random()*100+"%";
    s.style.animationDuration=(5+Math.random()*5)+"s";
    bg.appendChild(s);
  }
}

/* init */
createBG();
showScores();
startGame();
</script>

</body>
</html>
